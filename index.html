<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="TTT.css" />
    <script src="TTT.js" defer></script>
  </head>
  <body>
    <article class="main-container">
      <section class="player-one">
        <div class="name">player one</div>
        <div class="symbol">X</div>
        <div class="rounds-won" data-player="one">
          <p></p>
        </div>
      </section>
      <section class="game">
        <div class="board">
          <button
            role="button"
            class="cell"
            data-button="cell"
            data-cell="0"
          ></button>
          <button
            role="button"
            class="cell"
            data-button="cell"
            data-cell="1"
          ></button>
          <button
            role="button"
            class="cell"
            data-button="cell"
            data-cell="2"
          ></button>
          <button
            role="button"
            class="cell"
            data-button="cell"
            data-cell="3"
          ></button>
          <button
            role="button"
            class="cell"
            data-button="cell"
            data-cell="4"
          ></button>
          <button
            role="button"
            class="cell"
            data-button="cell"
            data-cell="5"
          ></button>
          <button
            role="button"
            class="cell"
            data-button="cell"
            data-cell="6"
          ></button>
          <button
            role="button"
            class="cell"
            data-button="cell"
            data-cell="7"
          ></button>
          <button
            role="button"
            class="cell"
            data-button="cell"
            data-cell="8"
          ></button>
        </div>
        <div class="active-player"></div>
        <button
          role="button"
          class="show-modal button"
          data-button="show-modal"
        >
          <span class="text">start a new game</span>
        </button>
        <button
          role="button"
          class="show-modal"
          data-button="reset"
        >reset board</button>
      </section>
      <section class="player-two">
        <div class="name">player Two</div>
        <div class="symbol">O</div>
        <div class="rounds-won">
          <p></p>
        </div>
      </section>
    </article>
    <dialog id="dialog-box">
      <form id="form">
        <legend>enter players names</legend>
        <div class="input-wrapper">
          <label for="nameX-input">player name</label>
          <input
            type="text"
            placeholder="player X name"
            id="nameX-input"
            name="player-X-Name"
            value=""
          />
        </div>
        <div class="input-wrapper">
          <label for="nameO-input">player name</label>
          <input
            type="text"
            placeholder="player O name"
            id="nameO-input"
            name="player-O_name"
            value=""
          />
        </div>
        <button role="button" class="start-reset-btn" data-game="start">
          <span class="text">Start Game</span>
        </button>
      </form>
    </dialog>
  </body>
</html>
